name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Syntax-check every PHP file
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "LINT FAIL: $f"; fail=1; }
          done < <(find . -name '*.php' -not -path './vendor/*')
          exit $fail

  build:
    name: Build image
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out image name and tags
        id: img
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          TAGS="$IMAGE:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            MINOR="${VERSION%.*}"
            TAGS="$TAGS,$IMAGE:$VERSION,$IMAGE:$MINOR"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAGS="$TAGS,$IMAGE:$SHORT_SHA"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE"
          echo "Tags:  $TAGS"

          if [ -z "$TAGS" ]; then
            echo "::error::Tag list is empty — refusing to build."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Report which credential is in use
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "Using the GHCR_TOKEN secret (personal access token)."
          else
            echo "Using GITHUB_TOKEN. If the push is denied with write_package,"
            echo "either set Settings > Actions > General > Workflow permissions to"
            echo "'Read and write permissions', or add a GHCR_TOKEN secret."
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "### Image published"
            echo ""
            echo '```'
            echo "docker pull ${{ steps.img.outputs.image }}:latest"
            echo '```'
            echo ""
            echo "Make the package public: **Repo → Packages → Package settings → Change visibility**."
          } >> "$GITHUB_STEP_SUMMARY"
